<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#0F2027"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- decorative wave shapes -->
  <path d="M0,160 C300,220 900,100 1200,170 L1200,220 L0,220 Z" fill="url(#waveGrad)"/>
  <path d="M0,180 C350,230 850,130 1200,190 L1200,220 L0,220 Z" fill="#38BDF8" fill-opacity="0.08"/>

  <!-- main title -->
  <text x="600" y="100" font-family="'Segoe UI', 'Fira Code', monospace" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Rishabh Kumar Singh
  </text>

  <!-- tagline -->
  <text x="600" y="140" font-family="'Segoe UI', 'Fira Code', monospace" font-size="18" font-weight="400" fill="#38BDF8" text-anchor="middle">
    Aspiring Data Engineer  |  Pipelines, Warehouses &amp; AI
  </text>

  <!-- small accent line -->
  <rect x="520" y="155" width="160" height="2" fill="#38BDF8" fill-opacity="0.6"/>
</svg>
